name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Build web app
    run: npm run build

  - name: Verify Android project
    run: |
      test -f android/gradlew || (echo "ERROR: android/gradlew not found. Android project is missing." && exit 1)
      test -f android/app/build.gradle || test -f android/app/build.gradle.kts || (echo "ERROR: Android app Gradle file is missing." && exit 1)

  - name: Build release APK
    working-directory: android
    run: |
      chmod +x gradlew
      ./gradlew assembleRelease

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Study-Vault-Hub-APK
      path: android/app/build/outputs/apk/release/*.apk
      if-no-files-found: error
